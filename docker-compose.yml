services:
  db:
    image: postgres:16
    container_name: taphoa-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: taphoa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - taphoa-data:/var/lib/postgresql/data

volumes:
  taphoa-data:
